AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Always-on spend-control SCP for the member accounts: work only in us-east-1 and
  us-west-2, no EC2 instances, no Bedrock model use, and none of the listed
  fixed-cost services. Deploy in the management account, only after
  scripts/test-scp-spend-controls.sh passes. Implements the SCP requirements in
  openspec/specs/spend-controls/spec.md.

Parameters:
  TargetIds:
    Type: CommaDelimitedList
    Description: The OUs to attach the SCP to, from the account-structure stack's outputs.

Resources:
  SpendControlsScp:
    Type: AWS::Organizations::Policy
    Properties:
      Name: spend-controls
      Description: Limits Regions and denies EC2 instances, Bedrock models and fixed-cost services.
      Type: SERVICE_CONTROL_POLICY
      TargetIds: !Ref TargetIds
      Content:
        Version: "2012-10-17"
        Statement:
          # Global services are exempt. The list is AWS's example
          # (aws-samples/service-control-policy-examples, Region-controls) and may
          # miss newer global services; extend it when one is denied.
          - Sid: DenyOutsideAllowedRegions
            Effect: Deny
            NotAction:
              - a4b:*
              - acm:*
              - aws-marketplace-management:*
              - aws-marketplace:*
              - aws-portal:*
              - budgets:*
              - ce:*
              - chime:*
              - cloudfront:*
              - config:*
              - cur:*
              - directconnect:*
              - ec2:DescribeRegions
              - ec2:DescribeTransitGateways
              - ec2:DescribeVpnGateways
              - fms:*
              - globalaccelerator:*
              - health:*
              - iam:*
              - importexport:*
              - kms:*
              - mobileanalytics:*
              - networkmanager:*
              - organizations:*
              - pricing:*
              - route53:*
              - route53domains:*
              - route53-recovery-cluster:*
              - route53-recovery-control-config:*
              - route53-recovery-readiness:*
              - s3:GetAccountPublic*
              - s3:ListAllMyBuckets
              - s3:ListMultiRegionAccessPoints
              - s3:PutAccountPublic*
              - shield:*
              - sts:*
              - support:*
              - trustedadvisor:*
              - waf-regional:*
              - waf:*
              - wafv2:*
              - wellarchitected:*
            Resource: "*"
            Condition:
              StringNotEquals:
                aws:RequestedRegion: [us-east-1, us-west-2]
          - Sid: DenyEc2Instances
            Effect: Deny
            Action:
              - ec2:RunInstances
              - ec2:CreateFleet
              - ec2:RequestSpotInstances
              - ec2:RequestSpotFleet
            Resource: "*"
          - Sid: DenyBedrockModelUse
            Effect: Deny
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
              - bedrock:PutFoundationModelEntitlement
              - bedrock-mantle:*
            Resource: "*"
          - Sid: DenyFixedCostServices
            Effect: Deny
            Action:
              - ec2:CreateNatGateway
              - elasticloadbalancing:CreateLoadBalancer
              - sagemaker:Create*
              - redshift:CreateCluster
              - redshift-serverless:CreateNamespace
              - redshift-serverless:CreateWorkgroup
              - elasticmapreduce:RunJobFlow
              - kafka:CreateCluster
              - kafka:CreateClusterV2
              - es:CreateDomain
              - es:CreateElasticsearchDomain
              - aoss:CreateCollection
              - rds:CreateDBInstance
              - rds:CreateDBCluster
              - rds:RestoreDB*
            Resource: "*"

Outputs:
  PolicyId:
    Value: !Ref SpendControlsScp
